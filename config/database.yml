default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "root") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "root") %>
  host: <%= ENV.fetch("DATABASE_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DATABASE_PORT", 3306) %>

development:
  <<: *default
  database: candidate_onboarding_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: candidate_onboarding_test

production:
  primary:
    <<: *default
    database: candidate_onboarding_production
  cache:
    <<: *default
    database: candidate_onboarding_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: candidate_onboarding_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: candidate_onboarding_production_cable
    migrations_paths: db/cable_migrate
